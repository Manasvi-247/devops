<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello students &middot; Bind Mount</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        color: #4a3a63;
        background: radial-gradient(
            120% 90% at 15% 10%,
            #faf5ff 0%,
            transparent 55%
          ),
          radial-gradient(100% 80% at 85% 90%, #e3d2fb 0%, transparent 60%),
          linear-gradient(155deg, #f4ecff 0%, #e6d8fa 45%, #d9c9f6 100%);
      }

      .glow {
        position: fixed;
        width: 460px;
        height: 460px;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.55;
        pointer-events: none;
      }

      .glow.one {
        top: -140px;
        left: -120px;
        background: #cbb2f7;
      }

      .glow.two {
        bottom: -160px;
        right: -140px;
        background: #f0c9ec;
      }

      .card {
        position: relative;
        text-align: center;
        padding: 64px 72px;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 70px rgba(115, 84, 173, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
      }

      .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #a184d8;
        box-shadow: 0 0 0 6px rgba(161, 132, 216, 0.16);
        margin-bottom: 26px;
      }

      h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 300;
        font-size: clamp(2.4rem, 6vw, 4rem);
        letter-spacing: -0.015em;
        line-height: 1.05;
        color: #3f2f5c;
      }

      h1 em {
        font-style: italic;
        color: #7c5cb4;
      }

      .stack {
        margin: 22px 0 0;
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8d7bb0;
      }

      .rule {
        width: 46px;
        height: 1px;
        margin: 28px auto 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(124, 92, 180, 0.45),
          transparent
        );
      }

      .sign {
        margin: 18px 0 0;
        font-size: 0.78rem;
        font-weight: 300;
        letter-spacing: 0.04em;
        color: #9b8bbb;
      }
    </style>
  </head>
  <body>
    <div class="glow one"></div>
    <div class="glow two"></div>

    <main class="card">
      <span class="dot"></span>
      <h1>Hello <em>students</em>, edited live</h1>
      <p class="stack">Nginx &middot; Bind Mount</p>
      <div class="rule"></div>
      <p class="sign">built by Manasvi</p>
    </main>
  </body>
</html>
